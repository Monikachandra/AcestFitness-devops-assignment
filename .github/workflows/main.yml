name: ACEest Fitness CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-and-test:
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t aceest-fitness:latest .

      - name: Run Pytest inside Container
        run: |
          docker run --rm aceest-fitness:latest pytest tests/
